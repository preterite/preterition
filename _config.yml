# _config.yml -- preterite.net
#
# The site's identity and the build's rules. Read by Jekyll once, at build
# start; a change here needs a restart of `jekyll serve`, not just a
# rebuild. Reasons travel with the keys, because the source is meant to be
# read as closely as the site.
#
# Built by GitHub Actions, not by Pages' native builder: Pagefind indexes
# after Jekyll runs, the calendar data is derived before it, and the site
# rebuilds on a daily schedule, none of which the native build admits. The
# plugin whitelist that constrains the native build therefore does not
# constrain this one.

title: Mike Edwards
description: "Mike Edwards, Associate Professor: rhetoric, composition, technology, economy."
url: "https://preterite.net"   # absolute_url and the meta tags build from this
baseurl: ""                    # the site lives at the domain root

# Markdown. kramdown is Jekyll's default engine and already a dependency:
# pages/404.md relies on its `markdown="1"` block attribute. GFM input so
# fenced code blocks and tables read the way they do in Obsidian.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true            # no Rouge classes; the site styles <pre> itself

# Permalinks. No global key, deliberately. The page default,
# /:path/:basename:output_ext, is what yields about.md -> /about.html,
# keeping the archive's addresses, which `pretty` would not.
# That reasoning covers pages only: posts take Jekyll's `date` default,
# /:categories/:year/:month/:day/:title.html, which is not this site's post
# permalink. The posts scope below therefore sets one. A migrated post
# carrying its own `permalink:` from the extraction still wins over it.

# Layout derivation. A page source never asserts its layout; the build
# supplies it. One scope per row, general to specific -- Jekyll applies
# later, narrower entries over earlier, broader ones. A layout takes the
# name of the page it dresses, so no name is minted here.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: "index.md"
    values:
      layout: index
  - scope:
      path: "weblog/index.md"
    values:
      layout: weblog
  - scope:
      path: "protected-inquiries.md"
    values:
      layout: protected-inquiries
  - scope:
      path: "404.md"
    values:
      layout: "404"
  # Posts: layout `post`, at `_layouts/post.html`. Front matter from the
  # extraction
  # carries its own `layout:` and wins over this; the default covers a
  # hand-authored post that declines to state one.
  # A post's address is part of the site's design, so it is asserted here
  # rather than left to Jekyll's default, which was never about posts. The
  # `weblog/` segment comes from the source folder, not from :categories,
  # which is empty by design and must stay out of the path.
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /weblog/:year/:month/:day/:title/

# Plugins. Named and not counted, the list being open.
# jekyll-redirect-from writes a meta-refresh stub at each
# retired address -- the static shape of a 301 -- and carries /blog/... to
# /weblog/... after the migration. There is no /cv.html redirect: the old
# site never served that address, and the nav links the CV as a PDF rather
# than as a page. The redirect plugin is on the Pages whitelist, though the
# whitelist does not govern an Actions build.
#
# jekyll-feed generates the weblog's Atom feed at /feed.xml from site.posts,
# taking title, description and url from the keys above. Its feed_meta tag
# sits in _includes/head.html, and that tag is what makes the feed
# discoverable rather than merely present. The feed ships ahead of the
# migrated archive deliberately: the weblog's long readership is
# the cohort that reads by feed, and a feed switched on afterward would
# deliver the whole archive to every subscriber in a single push.
plugins:
  - jekyll-redirect-from
  - jekyll-feed

# What never reaches _site. The archival pages are excluded outright; they
# were renamed to .archived when their successors were written. Two
# reasons, and the second is the load-bearing one. Jekyll
# treats an unrecognized extension as a static asset and copies it verbatim,
# so the rename alone stopped them claiming the canonical URLs but left all
# twelve fetchable at /about.html.archived and its siblings. And their prose
# is not the author's: the generated scaffold invented biography -- fluent,
# plausible, naming a real university -- so this is content that must never
# be served rather than stale markup awaiting repair. The files stay in the
# working tree as a reading copy and reach the build never. Verbatim copying
# is still the mechanism carrying css/, js/, fonts/, img/ and resources/
# across; this exclusion is what stops it carrying these.
exclude:
  - "*.archived"
  - Gemfile
  - Gemfile.lock
  - LICENSE.txt
  - README.md
  - .gitattributes
  - .DS_Store
  - vendor/
  - node_modules/
  - design/

# Served, not built.
keep_files:
  - pagefind   # the post-build index, written into _site by the workflow
