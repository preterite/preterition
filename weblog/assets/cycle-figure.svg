<svg xmlns="http://www.w3.org/2000/svg" viewBox="11 17 588 704" role="img" aria-labelledby="cyc-title cyc-desc" font-family="'IBM Plex Sans', system-ui, sans-serif">
<title id="cyc-title">The cycle of writing: labor in, value out, over time</title>
<desc id="cyc-desc">A closed loop, drawn as time, runs clockwise through four boxed stages: production, distribution, use and re-production. A key above the loop shows time as the thick line, labor in as a solid arrow and value out as a dashed arrow. At every stage labor comes in from inside the loop and value goes out to appropriators outside it. At production, labor comes in from writer (ideating, typing); peers (reviewing); writer, editors (editing). Value goes out to the writer; reviewers; paid editors. At distribution, labor comes in from publishers' staff; platform workers; librarians. Value goes out to publishers; institutions; platforms. At use, labor comes in from students; scholars; readers. Value goes out to students; scholars; readers. At re-production, labor comes in from citing, quoting; syllabi, packets; commentary. Value goes out to cited authors; rankings, h-indices; future writers. Figure by Mike Edwards, licensed CC BY-NC-SA 4.0.</desc>
