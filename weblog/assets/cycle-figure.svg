<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 790" role="img" aria-labelledby="cyc-title cyc-desc" font-family="'IBM Plex Sans', system-ui, sans-serif">
<title id="cyc-title">The cycle of writing: labor in, value out, over time</title>
<desc id="cyc-desc">A closed loop, drawn as time, passing through four stages: production, distribution, use and re-production. At every stage labor comes in from inside the loop and value goes out to appropriators outside it.</desc>
