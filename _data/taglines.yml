# _data/taglines.yml -- the rotating taglines, and the single source for them.
#
# Michael's header, carried over verbatim from js/taglines.js, where these
# lived from the mockup until 2026-08-23:
#
#     These website taglines offer a rotating selection of precisely
#     calibrated obscure half-jokes to appear on the sidebar of non-weblog
#     pages and on the weblog page header. There are probably too many.
#
# Moved here to satisfy the build plan's "taglines as data" (Workstream 4)
# and to close a no-JavaScript defect: the tagline elements shipped empty and
# were filled at load, so with scripting off the weblog header lost its
# subject line entirely.
#
# js/taglines.js is now generated from this file at build and stays a
# separate cacheable request rather than being inlined -- one tagline
# contains `<!--`, which is inert in an external script and would open an
# HTML comment inside an inline one.
#
# Every scalar is double-quoted because these contain colons, quotes, dashes
# and leading `$` and `.` -- YAML would read several of them as structure.

