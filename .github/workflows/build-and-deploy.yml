# .github/workflows/build-and-deploy.yml
#
# Builds preterite.net and publishes it to GitHub Pages.
#
# Why a workflow at all, since Pages can build Jekyll by itself (RULED
# 2026-08-18): Pages hosts, Actions builds, and the only question was ever
# who runs Jekyll. Three things force Actions independently, so retiring any
# one of them does not reopen the question --
#
#   Pagefind is a POST-build indexer. It reads the finished _site/ and writes
#     an index back into it. Pages' native builder hands you no step after
#     Jekyll, so there is nowhere for it to run.
#   The widget data needs repository secrets. A Last.fm key cannot live in a
#     static site; it lives in Actions and never reaches the browser.
#   The 24-hour refresh needs a schedule. Pages' builder fires on push only.
#
# The Gemfile is plain Jekyll rather than the `github-pages` gem for the same
# reason: that gem's version pin and plugin whitelist are constraints of a
# builder this repository does not use.

name: Build and deploy

on:
  push:
    branches: [main]
  # The daily rebuild. It is not decoration: the tagline's no-JavaScript
  # baseline is chosen at build by day of year (_includes/tagline.html), so
  # a site that only builds on push shows one reader the same tagline for
  # months. When the Last.fm and calendar fetch steps land, this is the
  # cycle they run on. Note that GitHub disables scheduled workflows on a
  # repository with no activity for 60 days, and mails you when it does.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# Least privilege, and the two Pages-specific grants. `id-token: write` is
# not an oversight: deploy-pages authenticates to the Pages service with a
# short-lived OIDC token rather than with a stored credential, so without
# this the deploy job cannot prove who it is.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` deliberately: cancelling
# a half-finished Pages deploy is how a site ends up serving a partial tree.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Verified 2026-08-23 by `npm view pagefind version`, which returned 1.5.2.
  # The first value written here was 1.3.0, from memory, and was wrong -- the
  # reason it was marked unverified and then checked rather than trusted.
  # Pinned rather than `@latest`: a wrong pin fails the build loudly, where
  # `@latest` drifts silently, and a search index that changes format without
  # anyone deciding is the rot the rest of this refuses.
  PAGEFIND_VERSION: "1.5.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # bundler-cache: true does three things -- installs, caches the gems,
      # and runs `bundle install --deployment`, which fails rather than
      # resolving if Gemfile.lock does not match the Gemfile. That failure is
      # wanted: the lock is committed so the workflow builds what you ran.
      #
      # The Ruby pin is a choice and is flagged as one. Your machine runs
      # 4.0.6 and there is no .ruby-version file, so nothing in the
      # repository states a version; 3.4 is chosen because the Gemfile's
      # csv/base64/bigdecimal/logger gems exist to satisfy exactly the 3.4
      # standard-library removals. Adding a .ruby-version file and reading it
      # here would retire the guess.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # JEKYLL_ENV=production is what makes `jekyll.environment` read
      # "production" in Liquid. Nothing in the site branches on it today; it
      # is set because the alternative is discovering later that every build
      # ever made ran in development mode.
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # Pagefind runs AFTER Jekyll and writes /pagefind/ into the finished
      # tree. _config.yml's `keep_files: [pagefind]` matters for local serve,
      # not here -- this runner builds once into an empty directory.
      #
      # The index exists; wiring the hexagon trigger to it is separate work
      # and is not done. Until it is, this step produces an index nothing
      # queries, which is the right order: an unwired index is inert, where
      # a wired control with no index is a control that lies.
      - name: Index with Pagefind
        run: npx -y "pagefind@${PAGEFIND_VERSION}" --site _site

      # WHERE THE WIDGET FETCH GOES. _data/lastfm.json and
      # _data/calendar.json are committed last-known-good stubs so the build
      # never waits on a network call, and the fetch overwrites them before
      # Jekyll runs -- meaning the steps land ABOVE "Build with Jekyll", not
      # here. Left unwritten rather than stubbed: the scripts do not exist,
      # and their _data/ schema is an open ledger row.

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
