# .github/workflows/build-and-deploy.yml
#
# Fetches new webmentions, builds preterite.net and publishes it to GitHub
# Pages.
#
# Why a workflow at all, since Pages can build Jekyll by itself: Pages
# hosts, Actions builds, and the only question was ever who runs Jekyll.
# Each of the following forces Actions on its own, so
# retiring any one of them does not reopen the question --
#
#   Pagefind is a POST-build indexer. It reads the finished _site/ and writes
#     an index back into it. Pages' native builder hands you no step after
#     Jekyll, so there is nowhere for it to run.
#   The Upcoming widget's data is DERIVED before Jekyll reads it. Expanding
#     the calendar's recurrence rules is date arithmetic no template language
#     should be asked to carry, and the script writes _data/, which Jekyll
#     loads once at the start of the build. The native builder offers no step
#     before Jekyll either. See "Expand the calendar" below.
#   The 24-hour refresh needs a schedule. Pages' builder fires on push only.
#   Webmentions are fetched and committed. The site's webmention endpoint is
#     a hosted receiver; a job ahead of the build copies what it has received
#     into _data/webmentions/ and commits it to main, so the repository keeps
#     every mention and the build renders them. That takes a secret and a
#     write to the repository, and the native builder offers neither.
#
# One repository secret is held, WEBMENTION_IO_TOKEN, and one job fetches:
# `mentions`, which asks webmention.io for what it has received since the
# newest mention already in the repository. The token can read mentions
# and change nothing at the receiver. Nothing else fetches: Listening
# selects in Liquid from a committed list, and the calendar is committed at
# _calendar/preterite-upcoming.ics.
#
# The Gemfile is plain Jekyll rather than the `github-pages` gem for the same
# reason: that gem's version pin and plugin whitelist are constraints of a
# builder this repository does not use.

name: Build and deploy

on:
  push:
    branches: [main]
  # The daily rebuild. It is not decoration: the tagline's no-JavaScript
  # baseline is chosen at build by day of year (_includes/tagline.html), so
  # a site that only builds on push shows one reader the same tagline for
  # months. The Upcoming widget rides the same cycle for a different reason:
  # nothing is fetched, but the expansion window moves, so a build from
  # yesterday can name an event that has already passed. Webmentions ride it
  # too: each run fetches what the receiver has taken since the last, so a
  # mention waits at most a day for a build. Note that GitHub
  # disables scheduled workflows on a
  # repository with no activity for 60 days, and mails you when it does.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# Least privilege, and the two Pages-specific grants. `id-token: write` is
# not an oversight: deploy-pages authenticates to the Pages service with a
# short-lived OIDC token rather than with a stored credential, so without
# this the deploy job cannot prove who it is. The `mentions` job sets its
# own permissions, and a job that does gets only those: `contents: write`,
# held by that job alone.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` deliberately: cancelling
# a half-finished Pages deploy is how a site ends up serving a partial tree.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned rather than `@latest`: a wrong pin fails the build loudly, where
  # `@latest` drifts silently, and a search index that changes format
  # without anyone deciding is the rot the rest of this refuses. The
  # version is checked against the npm registry when it changes, never
  # written from memory.
  PAGEFIND_VERSION: "1.5.2"

jobs:
  # NEW WEBMENTIONS, COMMITTED BEFORE THE BUILD READS THE TREE.
  # The receiver holds a mention between its arrival and this fetch; the
  # repository is the record. This job copies new mentions into
  # _data/webmentions/<slug>/ with _scripts/fetch_webmentions.py and pushes
  # them to main, and the build below checks out that commit, so a mention
  # is on the site in the same run that fetched it.
  #
  # Why its own job: it is the only job that can write to the repository,
  # and it runs nothing but the checkout and a standard-library script.
  # The build job, which runs third-party actions and a package fetched
  # from npm, stays read-only.
  #
  # Why it cannot stop a deploy: both of its steps continue on error, so
  # the job succeeds whatever happens inside it, and the build falls back
  # to the commit that started the run. A mention not pushed this run is
  # fetched again the next, because the script asks for everything newer
  # than the newest file on disk.
  #
  # Why its push starts no second run: a push made with a job's own
  # GITHUB_TOKEN does not trigger workflows, which is GitHub's guard
  # against exactly this loop.
  #
  # A push can be refused when the comment service has committed a comment
  # in the meantime; the job rebases onto main and tries once more, and
  # otherwise leaves the mentions for the next run.
  mentions:
    name: Fetch new webmentions
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # python3 is the runner's own. The script needs only the standard
      # library, so nothing is installed into a job that can write.
      - name: Fetch new webmentions
        continue-on-error: true
        env:
          WEBMENTION_IO_TOKEN: ${{ secrets.WEBMENTION_IO_TOKEN }}
        run: python3 _scripts/fetch_webmentions.py

      - name: Commit new webmentions
        id: commit
        continue-on-error: true
        run: |
          if [ ! -d _data/webmentions ]; then
            echo "No webmentions on disk."
            exit 0
          fi
          git add _data/webmentions
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "webmentions: new mentions from webmention.io"
          for attempt in 1 2; do
            if git push --quiet origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! git pull --rebase --quiet origin main; then
              git rebase --abort 2>/dev/null || true
              break
            fi
          done
          echo "::warning::New webmentions were not pushed; the next run fetches them again."

  build:
    needs: mentions
    # Runs whatever the fetch job did, unless the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # The fetch job's commit when it pushed one; otherwise the commit that
      # started the run.
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.mentions.outputs.sha || github.sha }}

      # bundler-cache: true does three things -- installs, caches the gems,
      # and runs `bundle install --deployment`, which fails rather than
      # resolving if Gemfile.lock does not match the Gemfile. That failure is
      # wanted: the lock is committed so the workflow builds what you ran.
      #
      # The Ruby pin is a choice and is flagged as one. There is no
      # .ruby-version file, so nothing in the repository states a version;
      # 3.4 is chosen because the Gemfile's csv/base64/bigdecimal/logger
      # gems exist to satisfy exactly the 3.4 standard-library removals.
      # Adding a .ruby-version file and reading it here would retire the
      # guess.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # THE UPCOMING WIDGET'S DATA, DERIVED BEFORE JEKYLL READS IT.
      # _scripts/expand_calendar.py reads the committed calendar at
      # _calendar/preterite-upcoming.ics, expands its recurrence rules, and
      # overwrites _data/calendar.json. It must run above the Jekyll step:
      # Jekyll loads _data/ once, at the start of the build.
      #
      # Why a step at all, when Listening needs none: Listening selects from a
      # committed list in Liquid, and Liquid can do that. Every live event on
      # the calendar is an RRULE, and expanding one needs date arithmetic no
      # template language should be asked to carry.
      #
      # Why daily: the calendar's CONTENT changes only when it is
      # re-exported, but the NEXT FIVE ITEMS change every day, because the
      # expansion window moves. The cron above is that clock.
      #
      # No secret, no network, no fetch. The .ics is in the repository.
      # Pinned to an exact tag, not a floating major. astral-sh/setup-uv
      # publishes floating major refs only through v7 at this writing (read
      # off the repository's git/refs/tags: v1 through v7 and no v8, v9
      # or v10), so @v10 is unresolvable and fails the run at Set up job,
      # before a single step executes. The release is v10.0.1. A version is
      # not a ref: reading the current version off a README says nothing
      # about which tags point at it.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # --locked is the reproducibility guarantee and the reason uv itself is
      # not pinned here: it fails the build if expand_calendar.py.lock does not
      # match the script's inline dependency manifest, so the versions that run
      # are the committed ones whatever uv resolves them with. The dependency
      # declaration lives in the script (PEP 723) and the pins live beside it
      # in the lockfile -- one rule at one site, the same discipline that keeps
      # listening.html the only place the rotation is written.
      - name: Expand the calendar
        run: uv run --locked --script _scripts/expand_calendar.py

      # JEKYLL_ENV=production is what makes `jekyll.environment` read
      # "production" in Liquid. Nothing in the site branches on it today; it
      # is set because the alternative is discovering later that every build
      # ever made ran in development mode.
      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      # Pagefind runs AFTER Jekyll and writes /pagefind/ into the finished
      # tree. _config.yml's `keep_files: [pagefind]` matters for local serve,
      # not here -- this runner builds once into an empty directory.
      #
      # The site's search controls query this index; without this step
      # they would be controls with nothing behind them.
      - name: Index with Pagefind
        run: npx -y "pagefind@${PAGEFIND_VERSION}" --site _site

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    # Stated outright: with a condition on the build above it, this job
    # would otherwise judge the whole chain; it deploys when the build
    # succeeded.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
